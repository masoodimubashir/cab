<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>More</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Account</ion-label>
    </ion-list-header>
    <ion-item *ngIf="auth.getUser() as u">
      <ion-label>
        <p>{{ u.name }}</p>
        <small>{{ u.role }}</small>
      </ion-label>
    </ion-item>

    <ion-list-header>
      <ion-label>Driver</ion-label>
    </ion-list-header>
    <ion-item button detail="true" (click)="goRegistration()">
      <ion-icon name="document-text-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>
        <h2>Registration &amp; documents</h2>
        <p>Vehicle profile and DL / RC / Insurance / ID uploads</p>
      </ion-label>
    </ion-item>
    <ion-item button detail="true" (click)="goPerformance()">
      <ion-icon name="stats-chart-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>
        <h2>Performance</h2>
        <p>Rating and trip metrics</p>
      </ion-label>
    </ion-item>

    <ion-item button detail="false" (click)="signOut()" lines="full">
      <ion-icon name="log-out-outline" slot="start" color="danger" aria-hidden="true"></ion-icon>
      <ion-label color="danger">Sign out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
