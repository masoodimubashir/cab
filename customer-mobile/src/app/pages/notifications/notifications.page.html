<ion-content class="notif-page" [fullscreen]="true">
  <div class="inbox-shell">
    <header class="inbox-header">
      <div class="inbox-titlebar">
        <button type="button" class="inbox-icon-button" (click)="back()" aria-label="Back to Home"><ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon></button>
        <h1>Inbox</h1>
        <button type="button" class="inbox-icon-button" (click)="refresh()" [disabled]="loading || loadingMore" aria-label="Refresh notifications"><ion-icon name="refresh-outline" aria-hidden="true"></ion-icon></button>
      </div>
      <div class="inbox-filters" role="group" aria-label="Notification filters">
        <button type="button" [class.is-active]="filter === 'all'" [attr.aria-pressed]="filter === 'all'" (click)="setFilter('all')">Notifications</button>
        <button type="button" [class.is-active]="filter === 'unread'" [attr.aria-pressed]="filter === 'unread'" (click)="setFilter('unread')">Unread <span class="inbox-count" *ngIf="unreadCount">{{ unreadCount > 99 ? '99+' : unreadCount }}</span></button>
      </div>
    </header>
    <main>
      <div class="inbox-section-heading"><h2>Activity</h2><button type="button" class="inbox-text-button" (click)="markAllRead()" [disabled]="!unreadCount || markingAll || loading">{{ markingAll ? 'Marking as read…' : 'Mark all as read' }}</button></div>
      <div class="inbox-error" *ngIf="error" role="alert"><p>{{ error }}</p><button type="button" class="inbox-text-button" (click)="refresh()" [disabled]="loading">Try again</button></div>
      <p class="inbox-action-error" *ngIf="actionError" role="alert">{{ actionError }}</p>
      <div class="inbox-loading" *ngIf="loading" role="status" aria-label="Loading notifications">
        <div class="inbox-skeleton" *ngFor="let s of [1,2,3,4]" aria-hidden="true"><span class="dc-skeleton inbox-skeleton-avatar"></span><div><span class="dc-skeleton inbox-skeleton-title"></span><span class="dc-skeleton inbox-skeleton-body"></span><span class="dc-skeleton inbox-skeleton-time"></span></div></div>
      </div>
      <ul class="inbox-list" *ngIf="!loading && notifications.length" aria-label="Notifications">
        <li *ngFor="let n of notifications; trackBy: trackByNotification">
          <button type="button" class="inbox-notification" [class.is-unread]="!n.read_at" (click)="open(n)">
            <span class="inbox-avatar" aria-hidden="true"><ion-icon [icon]="iconFor(n)"></ion-icon></span>
            <span class="inbox-message">
              <span class="inbox-message-heading"><strong>{{ n.title }}</strong><span class="inbox-unread-dot" *ngIf="!n.read_at" aria-hidden="true"></span></span>
              <span class="sr-only" *ngIf="!n.read_at">Unread.</span>
              <span class="inbox-message-body" *ngIf="n.body">{{ n.body }}</span>
              <time class="inbox-message-time" *ngIf="n.created_at" [attr.datetime]="n.created_at">{{ n.created_at | date:'EEE, d MMM · h:mm a' }}</time>
            </span>
          </button>
        </li>
      </ul>
      <div class="inbox-empty" *ngIf="!loading && !notifications.length && !error">
        <span class="inbox-empty-icon"><ion-icon [name]="filter === 'unread' ? 'checkmark-done-outline' : 'notifications-outline'" aria-hidden="true"></ion-icon></span>
        <h3>{{ filter === 'unread' ? 'You’re all caught up' : 'Your inbox is clear' }}</h3>
        <p>{{ filter === 'unread' ? 'You have no unread notifications.' : 'Ride updates and important notices will appear here.' }}</p>
        <button type="button" class="inbox-text-button" *ngIf="filter === 'unread'" (click)="setFilter('all')">View all notifications</button>
      </div>
      <button type="button" class="inbox-load-more" *ngIf="!loading && nextPage" (click)="loadMore()" [disabled]="loadingMore">{{ loadingMore ? 'Loading…' : 'Load more notifications' }}</button>
    </main>
  </div>
</ion-content>
