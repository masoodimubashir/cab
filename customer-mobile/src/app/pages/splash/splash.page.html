<ion-content class="splash-content" [fullscreen]="true">
  <!-- Soft ambient gradient glows behind the brand block -->
  <div class="splash-aura" aria-hidden="true">
    <span class="aura aura-green"></span>
    <span class="aura aura-navy"></span>
    <span class="splash-sheen"></span>
  </div>

  <div class="splash-wrapper">
    <!-- Centered Visual Logo Block -->
    <div class="splash-logo-container">
      <img class="splash-logo-image" src="assets/dreamcabs-logo.jpeg" alt="DreamCabs" />

      <!-- Tagline -->
      <p class="splash-tagline">Your ride, your way</p>
    </div>
  </div>

  <!-- Subtle loading shimmer pinned near the bottom -->
  <div class="splash-loader" aria-label="Loading" role="status">
    <span class="splash-loader-track">
      <span class="splash-loader-bar"></span>
    </span>
    <span class="splash-dots" aria-hidden="true">
      <i></i><i></i><i></i>
    </span>
  </div>
</ion-content>
