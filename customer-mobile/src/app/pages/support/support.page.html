<ion-header class="ion-no-border">
  <ion-toolbar class="pg-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/customer-tabs/book"></ion-back-button>
    </ion-buttons>
    <ion-title class="pg-brandtitle"><span class="b-white">Dream</span><span class="b-green">Cabs</span></ion-title>
    <ion-buttons slot="end">
      <ion-button class="dc-press" (click)="load()" aria-label="Reload">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="pg-hero">
    <h1 class="pg-title">Help &amp; Support</h1>
    <p class="pg-subtitle">Reach customer support, browse common questions, or report an issue.</p>
  </div>
</ion-header>

<ion-content class="pg-content">
  <div class="pg-body pg-anim-body">
    <div class="pg-card" *ngIf="loading">
      <div class="dc-skeleton" style="height:46px;margin-bottom:10px"></div>
      <div class="dc-skeleton" style="height:46px;margin-bottom:10px"></div>
      <div class="dc-skeleton" style="height:46px"></div>
    </div>

    <ng-container *ngIf="!loading">
      <ng-container *ngIf="hasChannels">
        <p class="dc-section">Contact us</p>
        <div class="dc-list">
          <button class="dc-row dc-press" *ngIf="support?.customer_support_no" (click)="call(support?.customer_support_no)">
            <span class="dc-row__icon"><ion-icon name="headset-outline"></ion-icon></span>
            <span class="dc-row__text"><strong>Customer support</strong><small>{{ support?.customer_support_no }}</small></span>
            <ion-icon class="dc-row__chev" name="call-outline"></ion-icon>
          </button>
          <button class="dc-row dc-press" *ngIf="support?.support_email" (click)="email(support?.support_email)">
            <span class="dc-row__icon"><ion-icon name="mail-outline"></ion-icon></span>
            <span class="dc-row__text"><strong>Email us</strong><small>{{ support?.support_email }}</small></span>
            <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
          </button>
        </div>
      </ng-container>

      <ng-container *ngIf="support?.emergency_police_no">
        <p class="dc-section">Emergency</p>
        <div class="dc-list">
          <button class="dc-row dc-press" (click)="call(support?.emergency_police_no)">
            <span class="dc-row__icon dc-row__icon--danger"><ion-icon name="shield-half-outline"></ion-icon></span>
            <span class="dc-row__text"><strong>Police / Emergency</strong><small>{{ support?.emergency_police_no }}</small></span>
            <ion-icon class="dc-row__chev" name="call-outline"></ion-icon>
          </button>
        </div>
      </ng-container>

      <div class="pg-card" *ngIf="error">
        <div class="dc-empty" style="padding:24px 8px">
          <div class="dc-empty__icon"><ion-icon name="cloud-offline-outline"></ion-icon></div>
          <strong>Couldn&rsquo;t load support info</strong>
          <span>{{ error }}</span>
          <button class="dc-cta dc-cta--ghost dc-press" style="margin-top:14px;width:auto;padding:0 20px;height:44px" (click)="load()">
            <ion-icon name="refresh-outline"></ion-icon> Try again
          </button>
        </div>
      </div>

      <div class="pg-card sup-report">
        <div class="sup-report__icon"><ion-icon name="flag-outline"></ion-icon></div>
        <strong>Report a problem</strong>
        <span>Tell us what went wrong and we&rsquo;ll get back to you over email.</span>
        <button class="dc-cta dc-cta--dark dc-press" (click)="report()">
          <ion-icon name="create-outline"></ion-icon> Report a problem
        </button>
      </div>

      <p class="dc-section">Frequently asked</p>
      <div class="pg-card sup-faqcard">
        <ion-accordion-group class="sup-faq">
          <ion-accordion *ngFor="let f of faqs" [value]="f.q">
            <ion-item slot="header" lines="none" class="sup-faq__head">
              <span class="sup-faq__qicon"><ion-icon name="help-circle-outline"></ion-icon></span>
              <ion-label>{{ f.q }}</ion-label>
            </ion-item>
            <div slot="content" class="sup-faq__body">{{ f.a }}</div>
          </ion-accordion>
        </ion-accordion-group>
      </div>
    </ng-container>
  </div>
</ion-content>
