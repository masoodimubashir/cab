<ion-content [fullscreen]="true" class="voice-content">
  <main class="voice-page" aria-labelledby="voice-title">
    <header class="voice-header">
      <h1 id="voice-title">DreamCabs AI</h1>
      <a routerLink="/customer-tabs/go" aria-label="Close voice booking">Close<ion-icon name="close-outline" aria-hidden="true"></ion-icon></a>
    </header>
    <section class="voice-intro" aria-labelledby="voice-heading">
      <div class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="voice-status">Coming soon</span>
      <h2 id="voice-heading">Your voice.<br>Your next ride.</h2>
      <p>A simpler way to book is on the way.<br>Voice booking will be available here soon.</p>
    </section>
    <section class="voice-card" aria-labelledby="voice-manual-title">
      <span class="voice-card-icon"><ion-icon name="car-outline" aria-hidden="true"></ion-icon></span>
      <div><h2 id="voice-manual-title">Need a ride now?</h2><p>Choose your pickup and destination to find your next ride.</p></div>
    </section>
    <footer class="voice-actions">
      <a class="voice-book" routerLink="/customer-tabs/go">Book a ride<ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon></a>
    </footer>
  </main>
</ion-content>
