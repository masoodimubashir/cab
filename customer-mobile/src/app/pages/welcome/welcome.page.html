<ion-content [fullscreen]="true">
  <main class="welcome">
    <span class="wordmark">DreamCabs</span>

    <div class="art">
      <img src="assets/welcome-art.png" alt="A rider with a phone beside a taxi" (error)="useFallbackImage($event)" />
    </div>

    <section class="copy">
      <h1>Book a cab in seconds</h1>
      <p class="sub">Track your ride live and travel with drivers you can trust.</p>

      <ion-button expand="block" color="secondary" class="cta" (click)="goToLogin()">
        Continue with mobile number
      </ion-button>

      <p class="terms">
        By continuing you agree that you have read and accept our <br />
        <a (click)="goToTerms()">Terms &amp; Conditions</a> and <a (click)="goToPrivacy()">Privacy Policy</a>
      </p>
    </section>
  </main>
</ion-content>
