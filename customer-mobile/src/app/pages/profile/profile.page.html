<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="back()" aria-label="Back">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="avatar-wrap">
    <label class="avatar-edit">
      <div
        class="avatar"
        [style.backgroundImage]="photoPreview ? 'url(' + photoPreview + ')' : null"
      ></div>
      <span class="plus-badge">+</span>
      <input type="file" accept="image/*" hidden (change)="onPhotoChange($event)" [disabled]="busy" />
    </label>
  </div>

  <ion-item lines="full">
    <ion-label position="stacked">Name *</ion-label>
    <ion-input [(ngModel)]="name" [disabled]="busy" autocomplete="name" required></ion-input>
  </ion-item>

  <ion-item lines="full">
    <ion-label position="stacked">Email (optional)</ion-label>
    <ion-input type="email" [(ngModel)]="email" [disabled]="busy" autocomplete="email"></ion-input>
  </ion-item>

  <ion-item lines="full" *ngIf="phone">
    <ion-label position="stacked">Phone</ion-label>
    <ion-input [value]="phone" disabled></ion-input>
  </ion-item>

  <ion-text color="danger" *ngIf="error"><p>{{ error }}</p></ion-text>

  <ion-button expand="block" class="ion-margin-top" (click)="submit()" [disabled]="busy">
    {{ busy ? 'Saving…' : 'Save' }}
  </ion-button>
</ion-content>
