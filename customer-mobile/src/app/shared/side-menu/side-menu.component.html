<ion-menu side="start" menuId="customer-menu" contentId="main-content">
  <ion-content class="menu-content">
    <div class="drawer__header drv-hero dc-anim-in dc-press" *ngIf="auth.getUser() as u" (click)="go('/customer-tabs/profile')">
      <span class="drv-badge drawer__badge">CUSTOMER</span>
      <div class="drawer__id">
        <div class="drawer__avatar">
          <img
            *ngIf="!avatarBroken && auth.resolveAvatarUrl(u) as url"
            [src]="url"
            alt=""
            (error)="avatarBroken = true"
          />
          <span *ngIf="avatarBroken || !auth.resolveAvatarUrl(u)" class="avatar-initials">{{ (u.name || 'U') | slice:0:1 | uppercase }}</span>
        </div>
        <div class="drawer__who">
          <strong>{{ u.name || 'Guest' }}</strong>
          <span class="drawer__role" *ngIf="u.phone">{{ u.phone }}</span>
          <span class="drawer__chip">
            <span class="drawer__chipdot"></span>Edit account
          </span>
        </div>
      </div>
    </div>

    <nav class="drawer__nav dc-stagger">
      <p class="drawer__group">Main</p>
      <button class="dc-row nav-row dc-press" (click)="go('/customer-tabs/book')">
        <span class="dc-row__icon"><ion-icon name="home-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Home</strong><small>Book a ride</small></span>
        <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
      </button>

      <p class="drawer__group">Bookings</p>
      <button class="dc-row nav-row dc-press" (click)="toggleRidesMenu()" [attr.aria-expanded]="ridesMenuOpen">
        <span class="dc-row__icon"><ion-icon name="car-sport-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Bookings</strong><small>Private, fixed, shuttle and scheduled</small></span>
        <ion-icon class="dc-row__chev" [name]="ridesMenuOpen ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
      </button>
      <div class="drawer__submenu" *ngIf="ridesMenuOpen">
        <button class="dc-row nav-row nav-row--sub dc-press" (click)="go('/customer-tabs/my-trips')">
          <span class="dc-row__icon"><ion-icon name="car-sport-outline"></ion-icon></span>
          <span class="dc-row__text"><strong>Private</strong><small>Your cab rides</small></span>
        </button>
        <button class="dc-row nav-row nav-row--sub dc-press" (click)="go('/customer-tabs/fixed-rides')">
          <span class="dc-row__icon"><ion-icon name="git-branch-outline"></ion-icon></span>
          <span class="dc-row__text"><strong>Fixed</strong><small>Fixed route bookings</small></span>
        </button>
        <button class="dc-row nav-row nav-row--sub dc-press" (click)="go('/customer-tabs/shuttle-rides')">
          <span class="dc-row__icon"><ion-icon name="bus-outline"></ion-icon></span>
          <span class="dc-row__text"><strong>Shuttle</strong><small>Shared shuttle rides</small></span>
        </button>
        <button class="dc-row nav-row nav-row--sub dc-press" (click)="go('/customer-tabs/scheduled-rides')">
          <span class="dc-row__icon"><ion-icon name="calendar-outline"></ion-icon></span>
          <span class="dc-row__text"><strong>Scheduled</strong><small>Upcoming planned rides</small></span>
        </button>
      </div>

      <p class="drawer__group">Account</p>
      <button class="dc-row nav-row dc-press" (click)="go('/customer-tabs/saved-locations')">
        <span class="dc-row__icon"><ion-icon name="location-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Location</strong><small>Saved pickup and drop places</small></span>
        <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
      </button>
      <button class="dc-row nav-row dc-press" (click)="go('/customer-tabs/notifications')">
        <span class="dc-row__icon"><ion-icon name="notifications-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Notifications</strong><small>Ride updates and alerts</small></span>
        <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
      </button>
      <button class="dc-row nav-row dc-press" (click)="go('/customer-tabs/coupons')">
        <span class="dc-row__icon"><ion-icon name="pricetags-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Coupons</strong><small>Offers and promo codes</small></span>
        <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
      </button>

      <p class="drawer__group">Help &amp; Support</p>
      <button class="dc-row nav-row dc-press" (click)="go('/customer-tabs/emergency-contacts')">
        <span class="dc-row__icon"><ion-icon name="people-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Contact</strong><small>SOS contacts</small></span>
        <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
      </button>
      <button class="dc-row nav-row dc-press" (click)="go('/customer-tabs/support')">
        <span class="dc-row__icon"><ion-icon name="help-buoy-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Help &amp; Support</strong><small>Contact us, FAQ &amp; report</small></span>
        <ion-icon class="dc-row__chev" name="chevron-forward-outline"></ion-icon>
      </button>
    </nav>

    <div class="drawer__footer">
      <button class="dc-row nav-row nav-row--danger dc-press" (click)="signOut()">
        <span class="dc-row__icon dc-row__icon--danger"><ion-icon name="log-out-outline"></ion-icon></span>
        <span class="dc-row__text"><strong>Sign out</strong></span>
      </button>
    </div>
  </ion-content>
</ion-menu>
