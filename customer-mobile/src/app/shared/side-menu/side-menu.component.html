<ion-menu side="start" menuId="customer-menu" contentId="main-content">
  <ion-content class="menu-content">
    
    <!-- ============ PREMIUM HEADER PROFILE BLOCK ============ -->
    <div class="menu-profile-card" *ngIf="auth.getUser() as u" (click)="go('/customer-tabs/profile')">
      <div class="profile-avatar-wrap">
        <div class="avatar-circle">
          <img *ngIf="auth.resolveAvatarUrl(u)" [src]="auth.resolveAvatarUrl(u)" alt="avatar" />
          <ion-icon *ngIf="!auth.resolveAvatarUrl(u)" name="person" aria-hidden="true"></ion-icon>
        </div>
      </div>
      <div class="profile-details">
        <span class="hello-text">Hello,</span>
        <h2 class="name-text">{{ u.name || 'Guest' }}</h2>
        <span class="edit-link">Edit account</span>
      </div>
    </div>

    <!-- ============ NAVIGATION LINKS LIST ============ -->
    <ion-list lines="none" class="menu-items-list">
      
      <!-- Home Option -->
      <ion-item button (click)="go('/customer-tabs/book')" class="menu-item">
        <div class="icon-box" slot="start">
          <ion-icon name="home" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Home</ion-label>
      </ion-item>

      <!-- My orders Option -->
      <ion-item button (click)="go('/customer-tabs/my-trips')" class="menu-item">
        <div class="icon-box" slot="start">
          <ion-icon name="receipt" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">My orders</ion-label>
      </ion-item>

      <!-- Delete account Option -->
      <ion-item button (click)="confirmDeleteAccount()" class="menu-item danger-item">
        <div class="icon-box" slot="start">
          <ion-icon name="trash" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Delete account</ion-label>
      </ion-item>

      <!-- Sign out Option -->
      <ion-item button (click)="signOut()" class="menu-item danger-item">
        <div class="icon-box" slot="start">
          <ion-icon name="log-out" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Sign out</ion-label>
      </ion-item>

    </ion-list>
  </ion-content>
</ion-menu>
