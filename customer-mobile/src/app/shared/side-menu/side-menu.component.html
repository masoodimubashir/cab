<ion-menu side="start" menuId="customer-menu" contentId="main-content">
  <ion-content class="menu-content">

    <!-- ============ Dark profile header ============ -->
    <div class="menu-header" *ngIf="auth.getUser() as u" (click)="go('/customer-tabs/profile')">
      <div class="menu-avatar">
        <img
          *ngIf="!avatarBroken && auth.resolveAvatarUrl(u) as url"
          [src]="url"
          alt=""
          (error)="avatarBroken = true"
        />
        <span *ngIf="avatarBroken || !auth.resolveAvatarUrl(u)" class="avatar-initials">{{ (u.name || 'U') | slice:0:1 | uppercase }}</span>
      </div>
      <div class="menu-header-info">
        <h2 class="menu-name">{{ u.name || 'Guest' }}</h2>
        <span class="menu-phone" *ngIf="u.phone">{{ u.phone }}</span>
        <span class="menu-edit">Edit account <ion-icon name="chevron-forward"></ion-icon></span>
      </div>
    </div>

    <!-- ============ Navigation ============ -->
    <ion-list lines="none" class="menu-items-list">

      <ion-item button (click)="go('/customer-tabs/book')" class="menu-item" detail="false">
        <div class="icon-box" slot="start">
          <ion-icon name="home" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Home</ion-label>
        <ion-icon name="chevron-forward" slot="end" class="row-chev" aria-hidden="true"></ion-icon>
      </ion-item>

      <ion-item button (click)="go('/customer-tabs/my-trips')" class="menu-item" detail="false">
        <div class="icon-box" slot="start">
          <ion-icon name="car-sport" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Rides</ion-label>
        <ion-icon name="chevron-forward" slot="end" class="row-chev" aria-hidden="true"></ion-icon>
      </ion-item>

      <ion-item button (click)="go('/customer-tabs/saved-locations')" class="menu-item" detail="false">
        <div class="icon-box" slot="start">
          <ion-icon name="location" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Location</ion-label>
        <ion-icon name="chevron-forward" slot="end" class="row-chev" aria-hidden="true"></ion-icon>
      </ion-item>

      <ion-item button (click)="go('/customer-tabs/emergency-contacts')" class="menu-item" detail="false">
        <div class="icon-box" slot="start">
          <ion-icon name="people" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Contact</ion-label>
        <ion-icon name="chevron-forward" slot="end" class="row-chev" aria-hidden="true"></ion-icon>
      </ion-item>

      <ion-item button (click)="go('/customer-tabs/support')" class="menu-item" detail="false">
        <div class="icon-box" slot="start">
          <ion-icon name="headset" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Support</ion-label>
        <ion-icon name="chevron-forward" slot="end" class="row-chev" aria-hidden="true"></ion-icon>
      </ion-item>

    </ion-list>

    <!-- ============ Sign out (pinned to bottom) ============ -->
    <div class="menu-footer">
      <ion-item button (click)="signOut()" class="menu-item danger-item" lines="none" detail="false">
        <div class="icon-box" slot="start">
          <ion-icon name="log-out" class="menu-icon" aria-hidden="true"></ion-icon>
        </div>
        <ion-label class="menu-label">Sign out</ion-label>
      </ion-item>
    </div>

  </ion-content>
</ion-menu>
