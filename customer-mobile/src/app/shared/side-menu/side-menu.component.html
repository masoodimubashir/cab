<ion-menu side="start" menuId="customer-menu" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Account</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list lines="full">
      <ion-item *ngIf="auth.getUser() as u">
        <ion-avatar slot="start" *ngIf="u.avatar_path">
          <img [src]="u.avatar_path" alt="avatar" />
        </ion-avatar>
        <ion-label>
          <h2>{{ u.name || 'Guest' }}</h2>
          <p>{{ u.phone || u.email }}</p>
        </ion-label>
      </ion-item>

      <ion-item button (click)="go('/customer-tabs/my-trips')">
        <ion-icon name="receipt-outline" slot="start" aria-hidden="true"></ion-icon>
        <ion-label>My orders</ion-label>
      </ion-item>

      <ion-item button (click)="signOut()">
        <ion-icon name="log-out-outline" slot="start" color="danger" aria-hidden="true"></ion-icon>
        <ion-label color="danger">Sign out</ion-label>
      </ion-item>

      <ion-item button (click)="confirmDeleteAccount()">
        <ion-icon name="trash-outline" slot="start" color="danger" aria-hidden="true"></ion-icon>
        <ion-label color="danger">Delete account</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
