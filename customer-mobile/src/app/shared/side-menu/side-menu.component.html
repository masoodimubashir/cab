<ion-menu side="start" menuId="customer-menu" contentId="main-content">
  <ion-content class="menu-content">
    <div class="account-drawer">
      <header class="drawer-title"><h1>Account</h1><button type="button" (click)="closeMenu()" aria-label="Close account menu"><ion-icon name="close-outline" aria-hidden="true"></ion-icon></button></header>
      <button type="button" class="account-profile" *ngIf="user as u" (click)="go('/customer-tabs/profile')" aria-label="Edit your profile">
        <span class="account-avatar"><img *ngIf="!avatarBroken && auth.resolveAvatarUrl(u) as url" [src]="url" alt="" (error)="avatarBroken = true"/><span *ngIf="avatarBroken || !auth.resolveAvatarUrl(u)">{{ getInitial(u) }}</span></span>
        <span class="account-identity"><strong>{{ u.name || 'Your account' }}</strong><small *ngIf="u.phone">{{ maskedPhone(u.phone) }}</small></span><span class="edit-pill">Edit</span>
      </button>
      <button type="button" class="account-offer" (click)="go('/customer-tabs/coupons')">
        <span><strong>Offers for your next ride</strong><small>Find your available coupons.</small><span class="offer-action">View offers <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon></span></span>
        <span class="offer-icon"><ion-icon name="gift-outline" aria-hidden="true"></ion-icon></span>
      </button>
      <nav aria-label="Account menu">
        <section class="menu-card service-bookings" aria-label="Bookings by service">
          <button type="button" class="menu-row" (click)="go('/customer-tabs/my-trips')"><ion-icon name="car-outline" aria-hidden="true"></ion-icon><span>Private Booking</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
          <button type="button" class="menu-row" (click)="go('/customer-tabs/fixed-rides')"><ion-icon name="bus-outline" aria-hidden="true"></ion-icon><span>Fixed Booking</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
          <button type="button" class="menu-row" (click)="go('/customer-tabs/shuttle-rides')"><ion-icon name="git-merge-outline" aria-hidden="true"></ion-icon><span>Shuttle Booking</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
          <button type="button" class="menu-row" (click)="go('/customer-tabs/scheduled-rides')"><ion-icon name="calendar-outline" aria-hidden="true"></ion-icon><span>Scheduled rides</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
        </section>
        <section class="menu-card" aria-label="Offers and refunds">
          <button type="button" class="menu-row" (click)="go('/customer-tabs/coupons')"><ion-icon name="pricetag-outline" aria-hidden="true"></ion-icon><span>Coupons and offers</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
          <button type="button" class="menu-row" (click)="go('/customer-tabs/refunds')"><ion-icon name="receipt-outline" aria-hidden="true"></ion-icon><span>My refunds</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
        </section>
        <section class="menu-card" aria-label="Contacts">
          <button type="button" class="menu-row" (click)="go('/customer-tabs/emergency-contacts')"><ion-icon name="people-outline" aria-hidden="true"></ion-icon><span>Contacts</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
        </section>
        <section class="menu-card" aria-label="Places and notifications">
          <button type="button" class="menu-row" (click)="go('/customer-tabs/saved-locations')"><ion-icon name="location-outline" aria-hidden="true"></ion-icon><span>Saved places</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
          <button type="button" class="menu-row" (click)="go('/customer-tabs/notifications')"><ion-icon name="notifications-outline" aria-hidden="true"></ion-icon><span>Notifications</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
        </section>
        <section class="menu-card" aria-label="Legal and policies">
          <button type="button" class="menu-row" (click)="go('/customer-tabs/terms')"><ion-icon name="document-outline" aria-hidden="true"></ion-icon><span>Terms and conditions</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
          <button type="button" class="menu-row" (click)="go('/customer-tabs/privacy')"><ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon><span>Privacy policy</span><ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon></button>
        </section>
      </nav>
      <footer class="account-footer"><button type="button" class="sign-out" (click)="signOut()">Sign out</button><button type="button" class="sign-out delete-account" (click)="confirmDeleteAccount()">Delete account</button></footer>
    </div>
  </ion-content>
  <ion-footer class="account-tabs-footer">
    <nav class="account-bottom-nav" aria-label="Customer navigation">
      <button type="button" (click)="go('/customer-tabs/go')" [class.is-selected]="isTabActive('/customer-tabs/go')" [attr.aria-current]="isTabActive('/customer-tabs/go') ? 'page' : null"><ion-icon name="home-outline" aria-hidden="true"></ion-icon><span>Home</span></button>
      <button type="button" (click)="go('/customer-tabs/trips')" [class.is-selected]="isTabActive('/customer-tabs/trips')" [attr.aria-current]="isTabActive('/customer-tabs/trips') ? 'page' : null"><ion-icon name="document-text-outline" aria-hidden="true"></ion-icon><span>Trips</span></button>
      <button type="button" (click)="go('/customer-tabs/go/voice')" [class.is-selected]="isTabActive('/customer-tabs/go/voice')" [attr.aria-current]="isTabActive('/customer-tabs/go/voice') ? 'page' : null"><ion-icon name="mic-outline" aria-hidden="true"></ion-icon><span>Voice</span></button>
      <button type="button" (click)="go('/customer-tabs/support')" [class.is-selected]="isTabActive('/customer-tabs/support')" [attr.aria-current]="isTabActive('/customer-tabs/support') ? 'page' : null"><ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon><span>Safety</span></button>
      <button type="button" (click)="go('/customer-tabs/profile')" [class.is-selected]="isTabActive('/customer-tabs/profile')" [attr.aria-current]="isTabActive('/customer-tabs/profile') ? 'page' : null"><ion-icon name="person-outline" aria-hidden="true"></ion-icon><span>Account</span></button>
    </nav>
  </ion-footer>
</ion-menu>
