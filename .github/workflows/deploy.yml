name: DreamCabs Production Deploy

on:
  push:
    branches:
      - master
      - main
      - opeartor-payments
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GoDaddy VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting automated deployment on GoDaddy VPS..."
            cd /var/www/dreamcabs
            CURRENT_BRANCH=$(git branch --show-current || echo "master")
            echo "📥 Fetching latest changes from Git ($CURRENT_BRANCH)..."
            git pull origin "$CURRENT_BRANCH" || git pull
            
            echo "🔨 Running unified build & deploy..."
            bash backend/deploy/deploy.sh
            
            echo "✅ Deployment completed successfully!"
