name: DreamCabs Production Deploy

on:
  push:
    branches:
      - master
      - main
      - opeartor-payments
  workflow_dispatch:

# All branches deploy to the same VPS; never overlap or cancel a running release.
concurrency:
  group: dreamcabs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GoDaddy VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            export DREAMCABS_FRONTEND_CONFIG_DIR=/home/dreamcabs/dreamcabs-config/frontend
            # Check access before git pull can remove the formerly tracked files.
            for config_name in environment.ts environment.prod.ts; do
              if [ ! -r "$DREAMCABS_FRONTEND_CONFIG_DIR/$config_name" ] || [ ! -s "$DREAMCABS_FRONTEND_CONFIG_DIR/$config_name" ]; then
                echo "Deployment stopped: private frontend configuration is missing or unreadable for $(id -un)." >&2
                exit 1
              fi
            done
            echo "🚀 Starting automated deployment on GoDaddy VPS..."
            cd /var/www/dreamcabs
            CURRENT_BRANCH=$(git branch --show-current || echo "master")
            echo "📥 Fetching latest changes from Git ($CURRENT_BRANCH)..."
            git pull --ff-only origin "$CURRENT_BRANCH"
            
            echo "🔨 Running unified build & deploy..."
            bash backend/deploy/deploy.sh
            
            echo "✅ Deployment completed successfully!"
