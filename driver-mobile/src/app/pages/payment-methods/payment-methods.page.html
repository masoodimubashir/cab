<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="back()" aria-label="Back">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Payment methods</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Payment methods I accept</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-icon name="cash-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>Cash</ion-label>
      <ion-toggle slot="end" [(ngModel)]="acceptCash" (ionChange)="toggleChanged()"></ion-toggle>
    </ion-item>
    <ion-item>
      <ion-icon name="phone-portrait-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>UPI</ion-label>
      <ion-toggle slot="end" [(ngModel)]="acceptUpi" (ionChange)="toggleChanged()"></ion-toggle>
    </ion-item>
    <ion-item lines="full">
      <ion-icon name="qr-code-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>QR code</ion-label>
      <ion-toggle slot="end" [(ngModel)]="acceptQr" (ionChange)="toggleChanged()"></ion-toggle>
    </ion-item>
  </ion-list>

  <p class="muted small ion-padding-horizontal">
    Customers who pay with a method you don't accept will be matched to a different driver.
  </p>
</ion-content>
