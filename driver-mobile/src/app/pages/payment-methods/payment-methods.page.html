<ion-header class="ion-no-border">
  <ion-toolbar class="pg-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="reload()" aria-label="Reload">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="pg-content">
  <div class="pg-hero">
    <h1 class="pg-title">Payment methods</h1>
    <p class="pg-subtitle">Choose what you accept</p>
  </div>

  <div class="pg-body pg-anim-body">
    <div class="pg-card">
      <div class="pm-row">
        <span class="pm-card__icon">
          <ion-icon name="cash-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="pm-card__text">
          <strong>Cash</strong>
          <small>Collect fares in person at drop-off</small>
        </span>
        <ion-toggle
          class="pm-card__toggle"
          [(ngModel)]="acceptCash"
          (ionChange)="toggleChanged()"
          aria-label="Accept cash"
        ></ion-toggle>
      </div>

      <div class="pm-row">
        <span class="pm-card__icon pm-card__icon--brand">
          <ion-icon name="phone-portrait-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="pm-card__text">
          <strong>Razorpay</strong>
          <small>Accept UPI, cards &amp; online payments</small>
        </span>
        <ion-toggle
          class="pm-card__toggle"
          [(ngModel)]="acceptRazorpay"
          (ionChange)="toggleChanged()"
          aria-label="Accept Razorpay"
        ></ion-toggle>
      </div>
    </div>

    <div class="pg-card pm-note">
      <ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>
      <span>
        Customers who pay with a method you don't accept will be matched to a
        different driver. Keep at least one method enabled.
      </span>
    </div>
  </div>
</ion-content>
