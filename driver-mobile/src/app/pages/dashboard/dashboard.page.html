<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="refresh()" [disabled]="loading" aria-label="Refresh">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  <!-- Full-bleed map. The button bar floats above it. -->
  <div #mapDiv class="map-canvas"></div>

  <ion-text color="danger" *ngIf="error">
    <div class="banner banner--err">{{ error }}</div>
  </ion-text>

  <div class="status-pill" *ngIf="driver">
    <span class="dot" [class.dot--on]="isOnline"></span>
    {{ isOnline ? 'Online' : 'Offline' }}
  </div>

  <!-- Bottom call-to-action. -->
  <div class="cta-bar">
    <ng-container *ngIf="driver; else loadingState">
      <ng-container *ngIf="isApproved; else notApproved">
        <ion-button
          *ngIf="!isOnline"
          expand="block"
          color="success"
          size="large"
          (click)="goOnline()"
          [disabled]="toggling"
        >
          <ion-icon name="power-outline" slot="start"></ion-icon>
          {{ toggling ? 'Going online…' : 'Go Online' }}
        </ion-button>
        <ion-button
          *ngIf="isOnline"
          expand="block"
          color="medium"
          fill="outline"
          size="large"
          (click)="goOffline()"
          [disabled]="toggling"
        >
          <ion-icon name="stop-circle-outline" slot="start"></ion-icon>
          {{ toggling ? 'Going offline…' : 'Go Offline' }}
        </ion-button>
      </ng-container>

      <ng-template #notApproved>
        <div class="warn-card">
          Your account isn't approved yet. Hang tight — the operator will let you know.
        </div>
      </ng-template>
    </ng-container>

    <ng-template #loadingState>
      <ion-button expand="block" size="large" [disabled]="true">Loading…</ion-button>
    </ng-template>
  </div>
</ion-content>
