<ion-header class="ion-no-border">
  <ion-toolbar class="pg-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="dc-press" (click)="refresh()" aria-label="Reload">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="pg-content">
  <div class="pg-hero">
    <h1 class="pg-title">Notifications</h1>
    <p class="pg-subtitle">{{ unreadCount ? unreadCount + ' unread' : 'You\'re all caught up.' }}</p>
  </div>

  <div class="pg-body pg-anim-body">
    <div class="nt-toolbar" *ngIf="!loading && notifications.length">
      <button class="nt-markall dc-press" (click)="markAllRead()" [disabled]="!unreadCount">Mark all read</button>
    </div>

    <div *ngIf="error" class="dc-card nt-error">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span>{{ error }}</span>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="nt-skeletons">
      <div class="dc-skeleton" style="height:78px"></div>
      <div class="dc-skeleton" style="height:78px"></div>
      <div class="dc-skeleton" style="height:78px"></div>
    </div>

    <!-- Notifications -->
    <div *ngIf="!loading && notifications.length" class="nt-list dc-stagger">
      <button *ngFor="let n of notifications" class="dc-card nt-item dc-press" [class.unread]="!n.read_at" (click)="open(n)">
        <span class="nt-icon"><ion-icon [name]="iconFor(n)"></ion-icon></span>
        <span class="nt-text">
          <span class="nt-title">{{ n.title }}</span>
          <span class="nt-body" *ngIf="n.body">{{ n.body }}</span>
          <span class="nt-time">{{ n.created_at | date:'d MMM, h:mm a' }}</span>
        </span>
        <span class="nt-dot" *ngIf="!n.read_at" aria-hidden="true"></span>
      </button>
    </div>

    <!-- Empty -->
    <div *ngIf="!loading && !notifications.length && !error" class="dc-empty dc-anim">
      <div class="dc-empty__icon"><ion-icon name="notifications-off-outline"></ion-icon></div>
      <strong>No notifications</strong>
      <span>Updates about your rides will appear here.</span>
    </div>
  </div>
</ion-content>
