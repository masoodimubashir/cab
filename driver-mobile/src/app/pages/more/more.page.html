<ion-header class="more-header" [translucent]="true">
  <ion-toolbar class="more-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>More</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="dc-content">
  <!-- Driver identity hero -->
  <section class="drv-hero">
    <div class="drv-hero__top">
      <span class="drv-status">
        <span class="drv-status__dot"></span>
        Online
      </span>
    </div>

    <div class="drv-hero__id" *ngIf="auth.getUser() as u">
      <div
        class="drv-hero__avatar"
        [class.has-photo]="auth.resolveAvatarUrl(u)"
        [style.backgroundImage]="auth.resolveAvatarUrl(u) ? 'url(' + auth.resolveAvatarUrl(u) + ')' : null"
      >
        <ion-icon *ngIf="!auth.resolveAvatarUrl(u)" name="person-circle-outline" aria-hidden="true"></ion-icon>
      </div>
      <div class="drv-hero__meta">
        <p class="drv-hero__name">{{ u.name }}</p>
        <small class="drv-hero__role">{{ (u.roles && u.roles.join(', ')) || u.role }}</small>
      </div>
    </div>
  </section>

  <div class="dc-body dc-stagger">
    <!-- Driver menu -->
    <p class="more-section">Driver</p>
    <div class="dc-list">
      <button type="button" class="dc-row dc-press" (click)="goProfile()">
        <span class="dc-row__icon">
          <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Profile</strong>
          <small>Name, email and photo</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="dc-row dc-press" (click)="goDocuments()">
        <span class="dc-row__icon">
          <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Documents</strong>
          <small>Vehicle details and DL / RC / Insurance / ID uploads</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="dc-row dc-press" (click)="goPerformance()">
        <span class="dc-row__icon">
          <ion-icon name="stats-chart-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Performance</strong>
          <small>Rating and trip metrics</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="dc-row dc-press" (click)="goPaymentMethods()">
        <span class="dc-row__icon">
          <ion-icon name="card-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Payment methods</strong>
          <small>Cash and Razorpay — choose what you accept</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="dc-row dc-press" (click)="goSubscriptions()">
        <span class="dc-row__icon">
          <ion-icon name="ribbon-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Subscriptions</strong>
          <small>Buy a plan for commission-free rides</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>
    </div>

    <!-- Help & Support -->
    <p class="more-section">Help &amp; Support</p>
    <div class="dc-list">
      <button type="button" class="dc-row dc-press" (click)="goEmergencyContacts()">
        <span class="dc-row__icon">
          <ion-icon name="people-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Contact</strong>
          <small>SOS contacts</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="dc-row dc-press" (click)="goSupport()">
        <span class="dc-row__icon">
          <ion-icon name="help-buoy-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong>Help &amp; Support</strong>
          <small>Contact us, FAQ &amp; report</small>
        </span>
        <ion-icon class="dc-row__chev" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>
    </div>

    <!-- Account / settings -->
    <p class="more-section">Settings</p>
    <div class="dc-list">
      <button type="button" class="dc-row dc-press" (click)="signOut()">
        <span class="dc-row__icon dc-row__icon--danger">
          <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong class="is-danger">Sign out</strong>
          <small>You will need to sign in again to go online</small>
        </span>
      </button>

      <button type="button" class="dc-row dc-press" (click)="confirmDeleteAccount()">
        <span class="dc-row__icon dc-row__icon--danger">
          <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="dc-row__text">
          <strong class="is-danger">Delete account</strong>
          <small>Permanently remove your account and data</small>
        </span>
      </button>
    </div>
  </div>
</ion-content>
