<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Trip history</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="refresh()" [disabled]="loading" aria-label="Refresh">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Status pills row. -->
  <div class="status-pills">
    <button class="pill" [class.pill--active]="status === 'all'" (click)="setStatus('all')">All</button>
    <button class="pill" [class.pill--active]="status === 'completed'" (click)="setStatus('completed')">Completed</button>
    <button class="pill" [class.pill--active]="status === 'cancelled'" (click)="setStatus('cancelled')">Cancelled</button>
    <button class="pill" [class.pill--active]="status === 'missed'" (click)="setStatus('missed')">Missed</button>
  </div>

  <!-- Payment pills row. -->
  <div class="status-pills">
    <button class="pill" [class.pill--active]="payment === 'all'" (click)="setPayment('all')">Any payment</button>
    <button class="pill" [class.pill--active]="payment === 'paid'" (click)="setPayment('paid')">Paid</button>
    <button class="pill" [class.pill--active]="payment === 'unpaid'" (click)="setPayment('unpaid')">Unpaid</button>
  </div>

  <ion-text color="danger" *ngIf="error" class="ion-padding"><p>{{ error }}</p></ion-text>
  <ion-spinner *ngIf="loading" class="ion-margin" name="crescent"></ion-spinner>

  <ion-list *ngIf="!loading && trips.length" lines="none">
    <ion-card *ngFor="let t of trips" class="trip-card">
      <ion-card-header>
        <div class="row-head">
          <ion-card-subtitle>Trip · #{{ t.id }}</ion-card-subtitle>
          <div class="badges">
            <ion-badge [color]="statusColor(t)">{{ statusLabel(t) }}</ion-badge>
            <ion-badge *ngIf="paymentBadge(t) as pb" [color]="pb.color">{{ pb.label }}</ion-badge>
          </div>
        </div>
      </ion-card-header>
      <ion-card-content>
        <p *ngIf="t.pickup_address" class="addr">
          <ion-icon name="ellipse-outline" color="primary"></ion-icon> {{ t.pickup_address }}
        </p>
        <p *ngIf="t.drop_address" class="addr">
          <ion-icon name="location-outline" color="danger"></ion-icon> {{ t.drop_address }}
        </p>

        <div class="meta">
          <span *ngIf="fareDisplay(t) as f"><ion-icon name="cash-outline"></ion-icon> {{ f }}</span>
          <span *ngIf="dateDisplay(t) as d"><ion-icon name="time-outline"></ion-icon> {{ d | date:'dd MMM yyyy, HH:mm' }}</span>
          <span *ngIf="t.payment?.method"><ion-icon name="card-outline"></ion-icon> {{ t.payment?.method }}</span>
        </div>

        <p *ngIf="t.cancelled_reason" class="reason muted small">{{ t.cancelled_reason }}</p>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <div *ngIf="!loading && !trips.length && !error" class="empty">
    <ion-icon name="car-outline"></ion-icon>
    <p>No trips match these filters.</p>
  </div>
</ion-content>
