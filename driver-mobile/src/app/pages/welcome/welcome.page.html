<ion-content class="ion-padding" [fullscreen]="true">
  <!-- Header / Logo Area -->
  <div class="logo-header">
    <img src="assets/dreamcabs-logo.png" alt="DreamCabs" class="welcome-brand-logo" />
  </div>

  <!-- Illustration Area (Placeholder for the vector graphic) -->
  <div class="illustration-container">
    <img src="assets/taxi-app-concept-illustration.jpg" alt="Drive with DreamCabs" (error)="useFallbackImage($event)" />
  </div>

  <!-- Main Content -->
  <div class="content-wrapper">
    <h1 class="welcome-title">Drive with Dream<span class="text-primary">Cabs</span></h1>

    <div class="actions">
      <!-- Main Phone Login Button -->
      <ion-button expand="block" color="secondary" class="action-btn main-btn" (click)="goToLogin()">
        <ion-icon slot="start" name="call"></ion-icon>
        Continue with Mobile Number
        <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <!-- Terms and Privacy -->
    <p class="terms-text">
      By continuing you agree that you have read and accept our <br>
      <a (click)="goToTerms()">Term & Conditions</a> and <a (click)="goToPrivacy()">Privacy Policy</a>
    </p>
  </div>
</ion-content>
