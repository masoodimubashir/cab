<ion-content [fullscreen]="true">
  <main class="welcome">
    <span class="wordmark" aria-label="Cabbies">Cabbies</span>

    <div class="art">
      <img src="assets/welcome-art.png" alt="A taxi and a rider with a phone" (error)="useFallbackImage($event)" />
    </div>

    <section class="copy">
      <h1>Drive with Cabbies</h1>
      <p class="sub">Take rides on your schedule, and fill empty seats with carpool.</p>

      <ion-button expand="block" color="secondary" class="cta" (click)="goToLogin()">
        Continue with mobile number
      </ion-button>

      <p class="terms">
        By continuing you agree that you have read and accept our <br />
        <a (click)="goToTerms()">Terms &amp; Conditions</a> and <a (click)="goToPrivacy()">Privacy Policy</a>
      </p>
    </section>
  </main>
</ion-content>
