<ion-content class="ec-page" [fullscreen]="true">

  <!-- ============ Hero header ============ -->
  <div class="page-header dc-anim-up">
    <button class="header-back dc-press" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h1 class="header-title">Contact</h1>
    <p class="header-sub">Trusted people we can reach in an SOS.</p>
  </div>

  <!-- ============ My Contacts ============ -->
  <div class="page-body">

    <div class="cta-row dc-anim-in">
      <button class="add-btn dc-press" (click)="openAdd()">
        <ion-icon name="create-outline"></ion-icon><span>Add manually</span>
      </button>
      <button class="add-btn outline dc-press" (click)="pickFromPhone()">
        <ion-icon name="person-add-outline"></ion-icon><span>Choose from device</span>
      </button>
    </div>

    <p class="page-error dc-anim-in" *ngIf="error"><ion-icon name="alert-circle-outline"></ion-icon> {{ error }}</p>

    <p class="section-label" *ngIf="!loading && contacts.length">Saved contacts</p>

    <div class="ec-list dc-stagger" *ngIf="!loading && contacts.length">
      <div class="ec-card dc-press" *ngFor="let c of contacts" (click)="openEdit(c)">
        <div class="ec-icon" [class.primary]="c.is_primary">
          <ion-icon [name]="c.is_primary ? 'star' : 'person'"></ion-icon>
        </div>
        <div class="ec-info">
          <span class="ec-name">{{ c.name }} <span class="ec-pill" *ngIf="c.is_primary">Primary</span></span>
          <span class="ec-meta">{{ c.phone }}<span *ngIf="c.relationship"> · {{ c.relationship }}</span></span>
        </div>
        <button class="ec-call dc-press" (click)="$event.stopPropagation(); callNumber(c.phone)" aria-label="Call">
          <ion-icon name="call"></ion-icon>
        </button>
        <button class="ec-del dc-press" (click)="$event.stopPropagation(); confirmDelete(c)" aria-label="Delete">
          <ion-icon name="trash-outline"></ion-icon>
        </button>
      </div>
    </div>

    <div class="state-box" *ngIf="loading">
      <div class="dc-skeleton sk-row"></div>
      <div class="dc-skeleton sk-row"></div>
      <div class="dc-skeleton sk-row"></div>
    </div>

    <div class="state-box dc-anim-in" *ngIf="!loading && !contacts.length">
      <div class="state-icon"><ion-icon name="people-outline"></ion-icon></div>
      <p class="state-title">No emergency contacts yet</p>
      <p class="state-sub">Add trusted people we can show in an SOS.</p>
    </div>
  </div>

  <!-- ============ Add / edit overlay ============ -->
  <div class="form-overlay" *ngIf="dialogOpen">
    <div class="form-backdrop" (click)="dialogOpen = false"></div>
    <div class="form-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title">{{ form.id ? 'Edit contact' : 'New contact' }}</h2>

      <div class="field-card">
        <label class="field-label">Name</label>
        <input type="text" [(ngModel)]="form.name" placeholder="Full name" [disabled]="saving" />
      </div>
      <div class="field-card">
        <label class="field-label">Phone</label>
        <div class="phone-row">
          <button type="button" class="cc-btn dc-press" (click)="showCountryPicker = true" [disabled]="saving">
            <span class="cc-flag">{{ selectedCountry.flag }}</span>
            <span class="cc-code">+{{ form.countryCode }}</span>
            <ion-icon name="chevron-down"></ion-icon>
          </button>
          <input
            type="tel"
            inputmode="numeric"
            maxlength="10"
            [(ngModel)]="form.phone"
            (ngModelChange)="onPhoneInput()"
            placeholder="9876543210"
            [disabled]="saving"
          />
        </div>
      </div>
      <div class="field-card">
        <label class="field-label">Relationship <span class="optional">· optional</span></label>
        <input type="text" [(ngModel)]="form.relationship" placeholder="e.g. Spouse" [disabled]="saving" />
      </div>
      <div class="toggle-card">
        <span class="toggle-label">Primary contact</span>
        <ion-toggle [(ngModel)]="form.is_primary" [disabled]="saving"></ion-toggle>
      </div>

      <p class="page-error" *ngIf="error"><ion-icon name="alert-circle-outline"></ion-icon> {{ error }}</p>

      <div class="modal-actions">
        <button class="btn-ghost dc-press" (click)="dialogOpen = false" [disabled]="saving">Cancel</button>
        <button class="btn-primary dc-press" (click)="submit()" [disabled]="saving">{{ saving ? 'Saving…' : 'Save' }}</button>
      </div>
    </div>
  </div>

  <!-- ============ Country code picker ============ -->
  <div class="form-overlay" *ngIf="showCountryPicker">
    <div class="form-backdrop" (click)="showCountryPicker = false"></div>
    <div class="form-sheet cc-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title">Select country</h2>
      <div class="cc-list">
        <button
          type="button"
          class="cc-item"
          [class.active]="c.code === form.countryCode"
          *ngFor="let c of countries"
          (click)="selectCountry(c)"
        >
          <span class="cc-flag">{{ c.flag }}</span>
          <span class="cc-name">{{ c.name }}</span>
          <span class="cc-code">+{{ c.code }}</span>
        </button>
      </div>
    </div>
  </div>
</ion-content>
