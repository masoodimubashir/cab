<ion-header class="ion-no-border nv-head">
  <div class="nv-drop">
    <div class="nv-top">
      <button type="button" class="nv-back" aria-label="Back to the welcome screen (logs out)" (click)="logout()"><ion-icon name="chevron-back-outline"></ion-icon></button>
      <span class="nv-step">Step 1 of 5</span>
    </div>
    <h1>How will you drive?</h1>
    <p>You can't switch later without a new review.</p>
    <div class="nv-bars" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i></div>
  </div>
</ion-header>

<ion-content [fullscreen]="false" class="dc-content cps">
  <div class="cps__wrap">
    <div class="cps__choices" role="radiogroup" aria-label="Driver type">
      <button type="button" class="cps-choice" role="radio"
              [attr.aria-checked]="choice === 'commercial'" [class.is-on]="choice === 'commercial'"
              (click)="pick('commercial')">
        <ion-icon name="car-sport-outline" aria-hidden="true"></ion-icon>
        <span class="cps-choice__text">
          <strong>Commercial driver</strong>
          <span>Private, Fixed and Shuttle rides. You earn per ride.</span>
        </span>
      </button>
      <button type="button" class="cps-choice" role="radio"
              [attr.aria-checked]="choice === 'carpool'" [class.is-on]="choice === 'carpool'"
              (click)="pick('carpool')">
        <ion-icon name="people-outline" aria-hidden="true"></ion-icon>
        <span class="cps-choice__text">
          <strong>Private car owner</strong>
          <span>Offer empty seats on trips you're already making.</span>
        </span>
      </button>
    </div>

    <p class="cps__note" *ngIf="choice === 'carpool'">
      Next: your photo, city, car and documents. Every carpool driver is checked by hand.
    </p>
  </div>
</ion-content>

<ion-footer class="ion-no-border nv-foot">
  <div class="nv-dock">
    <button type="button" class="nv-go" [disabled]="!choice" (click)="continue()">Continue</button>
  </div>
</ion-footer>
