# ===========================================================================
# DreamCabs backend — one command runs EVERYTHING the apps need:
#   nginx (API)  +  php-fpm  +  mysql  +  reverb (websockets)  +  queue worker
#   +  scheduler.  Bring it all up with:   docker compose up -d --build
#
# Config comes from ./.env (copy .env.production.example → .env and edit).
# Persisted data lives in named volumes (db_data, storage_data) so redeploys
# never lose the database or uploaded files.
# ===========================================================================
services:
  # ---- PHP-FPM (the app code; also runs migrations on boot) ---------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dreamcabs-backend:latest      # built once, reused by reverb/queue
    restart: unless-stopped
    env_file: [.env]
    environment:
      RUN_RELEASE_TASKS: "true"          # only this role migrates + caches
      REVERB_INTERNAL_HOST: "reverb"
      REVERB_INTERNAL_PORT: "8080"
      REVERB_INTERNAL_SCHEME: "http"
    volumes:
      - ./.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
      - ./deploy/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-dreamcabs.conf:ro
      - ./deploy/secrets:/secrets:ro     # put firebase.json here (see .env)
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  # ---- Nginx (public entrypoint on port 80 & 443 SSL) ---------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ../website:/var/www/website:ro
      - ../frontend/dist/frontend/browser:/var/www/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy

  # ---- MySQL 8 ------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-dreamcabs}"
      MYSQL_USER: "${DB_USERNAME:-dreamcabs}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Optional: expose 3306 to your laptop for debugging. Leave commented in prod.
    # ports: ["3306:3306"]

  # ---- Reverb websockets (real-time ride updates) -------------------------
  reverb:
    image: dreamcabs-backend:latest
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: [.env]
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
      - ./deploy/secrets:/secrets:ro
    depends_on:
      - app

  # ---- Queue worker (notifications, broadcasts, jobs) ---------------------
  queue:
    image: dreamcabs-backend:latest
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=2
    env_file: [.env]
    environment:
      REVERB_INTERNAL_HOST: "reverb"
      REVERB_INTERNAL_PORT: "8080"
      REVERB_INTERNAL_SCHEME: "http"
    volumes:
      - ./.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
      - ./deploy/secrets:/secrets:ro
    depends_on:
      - app

  # ---- Scheduler (Laravel cron — pricing/cleanup tasks, etc.) -------------
  scheduler:
    image: dreamcabs-backend:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: [.env]
    environment:
      REVERB_INTERNAL_HOST: "reverb"
      REVERB_INTERNAL_PORT: "8080"
      REVERB_INTERNAL_SCHEME: "http"
    volumes:
      - ./.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
      - ./deploy/secrets:/secrets:ro
    depends_on:
      - app

volumes:
  db_data:
  storage_data:
