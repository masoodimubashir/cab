openapi: 3.0.3
info:
  title: DreamCabs API
  version: 0.1.0
  description: Backend contract for DreamCabs (customer + driver mobile apps, admin panel).
servers:
  - url: http://localhost:8000/api
tags:
  - name: Health
  - name: Auth
  - name: Pricing
  - name: Trips
  - name: Payments
  - name: Safety
  - name: Ratings
  - name: Admin
  - name: Carpool
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health_check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /auth/otp/start:
    post:
      tags: [Auth]
      summary: Start OTP login
      operationId: auth_otp_start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: OTP sent (provider-specific)
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and issue app token
      operationId: auth_otp_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                requestId:
                  type: string
                idToken:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /pricing/estimate:
    post:
      tags: [Pricing]
      summary: Estimate fare before booking
      operationId: pricing_estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id, ride_type_id, pickup_lat, pickup_lng, drop_lat, drop_lng]
              properties:
                city_id:
                  type: integer
                ride_type_id:
                  type: integer
                pickup_address:
                  type: string
                pickup_lat:
                  type: number
                pickup_lng:
                  type: number
                drop_address:
                  type: string
                drop_lat:
                  type: number
                drop_lng:
                  type: number
      responses:
        "200":
          description: Estimated fare
          content:
            application/json:
              schema:
                type: object
  /trips:
    post:
      tags: [Trips]
      summary: Create trip booking (starts fare negotiation)
      operationId: trips_store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id, ride_type_id, pickup_lat, pickup_lng, drop_lat, drop_lng]
              properties:
                city_id:
                  type: integer
                ride_type_id:
                  type: integer
                pickup_address:
                  type: string
                pickup_lat:
                  type: number
                pickup_lng:
                  type: number
                drop_address:
                  type: string
                drop_lat:
                  type: number
                drop_lng:
                  type: number
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                type: object
  /trips/{tripId}/cancel:
    post:
      tags: [Trips]
      summary: Cancel trip (customer)
      operationId: trips_cancel
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Cancelled
  /trips/{tripId}/confirm:
    post:
      tags: [Trips]
      summary: Confirm final fare after negotiation (customer)
      operationId: trips_confirm
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_fare]
              properties:
                final_fare:
                  type: number
      responses:
        "200":
          description: Confirmed
  /trips/{tripId}/sos:
    post:
      tags: [Safety]
      summary: Trigger SOS safety event (customer or driver)
      operationId: trips_sos
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
                note:
                  type: string
      responses:
        "200":
          description: SOS event created
  /trips/{tripId}/driver-progress:
    patch:
      tags: [Trips]
      summary: Update trip progress and (optionally) location (driver)
      operationId: trips_driver_progress
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                location:
                  type: object
                  properties:
                    lat: { type: number }
                    lng: { type: number }
                    accuracy_m: { type: number }
                    speed_kmh: { type: number }
                    bearing_deg: { type: integer }
      responses:
        "200":
          description: Updated
  /trips/{tripId}/negotiation:
    get:
      tags: [Trips]
      summary: Get fare negotiation thread (customer/driver)
      operationId: negotiation_show
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Negotiation
          content:
            application/json:
              schema:
                type: object
  /trips/{tripId}/negotiation/customer-offer:
    post:
      tags: [Trips]
      summary: Submit a customer offer amount (customer)
      operationId: negotiation_customer_offer
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
      responses:
        "200":
          description: Offer added
  /trips/{tripId}/negotiation/customer-confirm:
    post:
      tags: [Trips]
      summary: Customer confirms final fare (locks negotiation)
      operationId: negotiation_customer_confirm
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_fare]
              properties:
                final_fare: { type: number }
      responses:
        "200":
          description: Confirmed
  /trips/{tripId}/negotiation/driver-action:
    post:
      tags: [Trips]
      summary: Driver accept or counter an offer
      operationId: negotiation_driver_action
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ACCEPT, COUNTER]
                amount:
                  type: number
      responses:
        "200":
          description: Driver action applied
  /drivers/register:
    post:
      tags: [Trips]
      summary: Register driver profile (vehicle details)
      operationId: drivers_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_type, vehicle_reg_no]
              properties:
                vehicle_type: { type: string }
                vehicle_brand: { type: string }
                vehicle_model: { type: string }
                vehicle_color: { type: string }
                vehicle_reg_no: { type: string }
      responses:
        "200":
          description: Driver profile saved
  /drivers/documents:
    post:
      tags: [Trips]
      summary: Upload driver document (DL/RC/INSURANCE/ID)
      operationId: drivers_upload_documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  enum: [DL, RC, INSURANCE, ID]
                file:
                  description: Multipart upload in the real request (kept generic here).
                  type: string
      responses:
        "200":
          description: Document uploaded
  /drivers/go-online:
    post:
      tags: [Trips]
      summary: Mark driver online (admin-approved + all docs must be approved)
      operationId: drivers_go_online
      responses:
        "200":
          description: Online
  /drivers/go-offline:
    post:
      tags: [Trips]
      summary: Mark driver offline
      operationId: drivers_go_offline
      responses:
        "200":
          description: Offline
  /trips/{tripId}/driver-accept:
    post:
      tags: [Trips]
      summary: Driver accepts assignment (after negotiation confirmation)
      operationId: ride_assignment_accept
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Assigned
  /trips/{tripId}/driver-reject:
    post:
      tags: [Trips]
      summary: Driver rejects assignment
      operationId: ride_assignment_reject
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Rejected
  /driver/trips/history:
    get:
      tags: [Ratings]
      summary: Driver trip history
      operationId: history_driver
      responses:
        "200":
          description: History page
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard KPIs
      operationId: admin_dashboard
      responses:
        "200":
          description: KPI payload
  /admin/drivers:
    get:
      tags: [Admin]
      summary: Admin list drivers
      operationId: admin_drivers
      responses:
        "200":
          description: Driver list
  /admin/drivers/{driverId}/approval:
    patch:
      tags: [Admin]
      summary: Admin approves/rejects a driver
      operationId: admin_driver_approval
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_status]
              properties:
                approval_status:
                  type: string
                  enum: [approved, rejected]
                rejection_reason:
                  type: string
      responses:
        "200":
          description: Updated driver
  /admin/drivers/documents/{documentId}/status:
    patch:
      tags: [Admin]
      summary: Admin sets driver document approval status
      operationId: admin_driver_document_status
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                rejection_reason:
                  type: string
      responses:
        "200":
          description: Updated document
  /admin/safety-events:
    get:
      tags: [Admin]
      summary: Admin list safety events
      operationId: admin_safety_events
      responses:
        "200":
          description: Safety events page
  /admin/pricing-rules:
    get:
      tags: [Admin]
      summary: Admin list pricing rules
      operationId: admin_pricing_rules
      responses:
        "200":
          description: Pricing rules page
  /admin/pricing-rules/{pricingRuleId}:
    patch:
      tags: [Admin]
      summary: Admin updates a pricing rule
      operationId: admin_pricing_rule_update
      parameters:
        - name: pricingRuleId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_fare: { type: number }
                surge_multiplier: { type: number }
                commission_percent: { type: number }
                threshold_distance_1_km: { type: number }
                fare_per_km_after_threshold_1: { type: number }
                threshold_time_1_min: { type: number }
                fare_per_min_after_threshold_time_1: { type: number }
      responses:
        "200":
          description: Updated pricing rule
  /admin/trips:
    get:
      tags: [Admin]
      summary: Admin list trips
      operationId: admin_trips
      responses:
        "200":
          description: Trips page
  /trips/{tripId}/location:
    post:
      tags: [Trips]
      summary: Update driver location (driver)
      operationId: trips_update_location
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                accuracy_m: { type: number }
                speed_kmh: { type: number }
                bearing_deg: { type: integer }
      responses:
        "200":
          description: Location updated
  /trips/{tripId}/share-link:
    post:
      tags: [Trips]
      summary: Create a tokenized trip share link (customer)
      operationId: trips_share_link_create
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Share token created
  /trip-share/{token}:
    get:
      tags: [Trips]
      summary: View shared trip tracking info (public by token)
      operationId: trips_share_link_show
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shared view
  /trips/{tripId}/pay/upi:
    post:
      tags: [Payments]
      summary: Start UPI payment (Razorpay) for trip
      operationId: trips_pay_upi
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payment initiation
  /trips/{tripId}/pay/cash:
    post:
      tags: [Payments]
      summary: Pay by cash for trip
      operationId: trips_pay_cash
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payment recorded
  /trips/{tripId}/invoice:
    get:
      tags: [Payments]
      summary: Get invoice metadata
      operationId: invoices_show
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice metadata
    post:
      tags: [Payments]
      summary: Generate invoice PDF
      operationId: invoices_generate
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Invoice generated
  /trips/{tripId}/invoice/download:
    get:
      tags: [Payments]
      summary: Download invoice PDF
      operationId: invoices_download
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF binary
  /trips/{tripId}/rating:
    post:
      tags: [Ratings]
      summary: Submit rating & feedback (customer)
      operationId: ratings_store
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Rating stored
  /customer/trips/history:
    get:
      tags: [Ratings]
      summary: Customer trip history
      operationId: history_customer
      responses:
        "200":
          description: History page
  /admin/users:
    get:
      tags: [Admin]
      summary: Admin list users
      operationId: admin_users
      responses:
        "200":
          description: Users page
  /admin/users/{userId}/role:
    patch:
      tags: [Admin]
      summary: Admin updates user role
      operationId: admin_user_role_update
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [customer, driver, admin]
      responses:
        "200":
          description: Role updated
  /admin/trips/{tripId}/latest-location:
    get:
      tags: [Admin]
      summary: Admin fetch latest stored driver location for a trip
      operationId: admin_trip_latest_location
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Latest location
  /payments/webhook/razorpay:
    post:
      tags: [Payments]
      summary: Razorpay webhook handler
      operationId: payments_razorpay_webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /carpool/config:
    get:
      tags: [Carpool]
      summary: Whether carpool is on, and the values the apps need
      description: >
        Answers even when the kill switch is on (then `enabled` is false and
        nothing else is sent). Apps show no carpool entry point unless this
        says enabled. Every other /carpool route returns 404 while the kill
        switch is on.
      operationId: carpool_config
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  search_distance_m: { type: integer, example: 2000 }
                  publish_horizon_days: { type: integer, example: 30 }
                  seats_max: { type: integer, example: 6 }
                  price_max: { type: integer, example: 5000 }
                  message_max_chars: { type: integer, example: 1000 }
                  timezone: { type: string, example: Asia/Kolkata }
        "401":
          description: Not logged in
  /carpool/driver/register:
    post:
      tags: [Carpool]
      summary: A private car owner signs up as a carpool driver (M1)
      description: >
        Creates (or, before approval, updates) a carpool driver: a drivers row
        with driver_type=carpool and the car in carpool_vehicles. Status is
        pending until an admin approves. Open whenever the kill switch is off,
        even while carpool is off for riders. Documents are then uploaded with
        POST /drivers/documents; GET /catalog/documents lists only carpool and
        all-driver documents for a carpool driver.
      operationId: carpool_driver_register
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, city_id, make, model, colour, plate, seats]
              properties:
                name: { type: string, maxLength: 120 }
                photo: { type: string, format: binary, description: Required unless a profile photo is already on file }
                email: { type: string, format: email }
                dob: { type: string, format: date, description: At least 18 years ago }
                address: { type: string }
                city_id: { type: integer }
                make: { type: string, maxLength: 60 }
                model: { type: string, maxLength: 60 }
                colour: { type: string, maxLength: 40 }
                plate: { type: string, example: JK01 AB 4521, description: Normalised to JK01AB4521; unique across commercial and carpool drivers }
                seats: { type: integer, minimum: 1, maximum: 6 }
                front_photo: { type: string, format: binary, description: Front of the car with the plate visible; required unless already on file }
                interior_photo: { type: string, format: binary }
      responses:
        "201":
          description: Saved; waiting for review
        "404":
          description: Kill switch is on
        "422":
          description: Invalid, plate taken, already a commercial driver, or already approved
  /carpool/plans:
    get:
      tags: [Carpool]
      summary: Carpool plans the driver can buy (M2)
      description: Carpool-audience plans in the driver's city, active now. Empty for anyone who isn't a carpool driver.
      operationId: carpool_plans
      responses:
        "200":
          description: "{ data: [{ id, title, subtitle, amount, days_count, terms }] }"
  /carpool/plan:
    get:
      tags: [Carpool]
      summary: The running plan, a waiting plan, and the publish gate (M2)
      operationId: carpool_plan_state
      responses:
        "200":
          description: "{ plan, next_plan, can_publish, ending_soon } (ending_soon = ends within 3 days with nothing waiting)"
  /carpool/plan/upi/order:
    post:
      tags: [Carpool]
      summary: Start a UPI payment for a carpool plan (M2)
      description: Approved carpool drivers only, plans of their city. The order is bound to this driver and plan for 2 hours.
      operationId: carpool_plan_order
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [plan_id], properties: { plan_id: { type: integer } } }
      responses:
        "200":
          description: "{ order_id, amount_paise, amount, currency, key_id, plan_id, plan_title }"
        "422":
          description: Not a carpool driver, not approved, or the plan isn't theirs
  /carpool/plan/upi/verify:
    post:
      tags: [Carpool]
      summary: Confirm the UPI payment and start the plan (M2)
      description: Checks the signature and the paid amount. A plan bought while one runs is queued to start when it ends; one waiting at a time. Safe to repeat.
      operationId: carpool_plan_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                plan_id: { type: integer }
                razorpay_order_id: { type: string }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
      responses:
        "201":
          description: "{ queued, subscription, message }"
        "422":
          description: Payment not verified, not complete, or doesn't match the plan
  /carpool/driver/home:
    get:
      tags: [Carpool]
      summary: Driver Home data (M3)
      operationId: carpool_driver_home
      responses:
        "200":
          description: "{ next: Listing|null, requests_on, has_live, recent: [{ start, end, departs_at }] }"
        "422":
          description: Not an approved carpool driver with a car
  /carpool/driver/requests:
    post:
      tags: [Carpool]
      summary: The Home Requests on/off switch for every carpool not yet started (M3, A2)
      operationId: carpool_driver_requests
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [on], properties: { on: { type: boolean } } }
      responses:
        "200":
          description: "{ requests_on }"
  /carpool/driver/listings:
    get:
      tags: [Carpool]
      summary: The driver's carpools for the Carpools tab (M3)
      description: India days. today = leaving today or in progress; upcoming = not started, after today; past = completed, cancelled, or left before today (latest 50).
      operationId: carpool_driver_listings
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [upcoming, today, past], default: upcoming } }
      responses:
        "200":
          description: "{ data: [Listing] } without route_polyline"
    post:
      tags: [Carpool]
      summary: Publish a carpool (M3)
      description: >
        Needs carpool enabled, an approved carpool driver with a car and an
        active plan. The departure must be in the future, within 30 days, and
        no later than the day after the plan (or the plan waiting after it)
        ends. Seats are at most the car's seats. Route check (P5): the line
        must start and end within 2 km of the places, the places at least
        1 km apart, the distance no shorter than the straight line, and the
        line's length within 50-150% of the distance. Lines over 500 points
        are thinned.
      operationId: carpool_driver_publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end, route, departs_at, seats, is_free]
              properties:
                start: { $ref: "#/components/schemas/CarpoolPlace" }
                end: { $ref: "#/components/schemas/CarpoolPlace" }
                route: { $ref: "#/components/schemas/CarpoolRoute" }
                departs_at: { type: string, format: date-time, example: "2026-11-19T08:30:00+05:30" }
                seats: { type: integer, minimum: 1, maximum: 6 }
                is_free: { type: boolean }
                price_per_seat: { type: integer, minimum: 1, maximum: 5000, description: Rupees; required unless is_free }
                accepting_requests: { type: boolean, default: true }
      responses:
        "201":
          description: "{ data: Listing } with route_polyline"
        "422":
          description: No plan, carpool off, not approved, or a rule above failed (errors keyed listing, route, seats, departs_at or price_per_seat)
  /carpool/driver/listings/{id}:
    get:
      tags: [Carpool]
      summary: One of the driver's carpools, with its route line (M3)
      operationId: carpool_driver_listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "{ data: Listing }"
        "404":
          description: Not this driver's carpool
    patch:
      tags: [Carpool]
      summary: Edit a carpool before it starts (M3, mockup 8h)
      description: Send only what changed. Start and destination can't change. Seats can't go below seats taken. Works without a plan; a new departure date must still fall within the plan rule.
      operationId: carpool_driver_listing_edit
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                departs_at: { type: string, format: date-time }
                seats: { type: integer }
                is_free: { type: boolean }
                price_per_seat: { type: integer }
                accepting_requests: { type: boolean }
                route: { $ref: "#/components/schemas/CarpoolRoute" }
      responses:
        "200":
          description: "{ data: Listing }"
        "422":
          description: Already started or ended, or a rule failed
  /carpool/driver/listings/{id}/delay:
    post:
      tags: [Carpool]
      summary: "+10 min delay (M3, mockup 8)"
      operationId: carpool_driver_listing_delay
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "{ data: Listing }"
  /carpool/driver/listings/{id}/cancel:
    post:
      tags: [Carpool]
      summary: Driver cancels a carpool before it starts (M3, mockup 8g)
      operationId: carpool_driver_listing_cancel
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 255, description: Optional reason shown to riders } } }
      responses:
        "200":
          description: "{ data: Listing } with status cancelled, cancel_reason driver"
        "422":
          description: Already started or ended
  /carpool/driver/inbox:
    get:
      tags: [Carpool]
      summary: Join requests waiting for the driver, grouped by carpool (M4)
      operationId: carpool_driver_inbox
      responses:
        "200": { description: OK }
  /carpool/driver/inbox/count:
    get:
      tags: [Carpool]
      summary: Number of waiting requests (the Inbox badge)
      operationId: carpool_driver_inbox_count
      responses:
        "200": { description: OK }
  /carpool/driver/join-requests/{carpoolRequest}:
    get:
      tags: [Carpool]
      summary: A rider's profile for one request. No phone number is sent.
      operationId: carpool_driver_request_show
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/driver/join-requests/{carpoolRequest}/accept:
    post:
      tags: [Carpool]
      summary: Accept a request. Locks the carpool and recounts seats, so simultaneous accepts cannot overbook.
      description: Gives the rider a 4-digit code. Pending requests that no longer fit close as filled.
      operationId: carpool_driver_request_accept
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "422": { description: Not enough seats left, or the request is not waiting }
  /carpool/driver/join-requests/{carpoolRequest}/decline:
    post:
      tags: [Carpool]
      summary: Decline a waiting request
      operationId: carpool_driver_request_decline
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/driver/join-requests/{carpoolRequest}/remove:
    post:
      tags: [Carpool]
      summary: Remove an accepted rider
      operationId: carpool_driver_request_remove
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/driver/join-requests/{carpoolRequest}/paid:
    post:
      tags: [Carpool]
      summary: Private Paid tick. The rider never sees it.
      operationId: carpool_driver_request_paid
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/search:
    get:
      tags: [Carpool]
      summary: Find carpools along the saved route (M4)
      description: >
        Query: from_lat, from_lng, to_lat, to_lng, date (India day), seats.
        Both points must be within the search distance of the route, the pickup
        before the drop. Ranked: requestable first, then shorter walk, then
        time. If the day is empty, the nearest other days are offered. Refused
        (422) while carpool is off.
      operationId: carpool_search
      responses:
        "200": { description: OK }
        "422": { description: Carpool is off, or the search is not valid }
  /carpool/rides/{listing}:
    get:
      tags: [Carpool]
      summary: One carpool as the rider sees it, with their own request if any
      operationId: carpool_ride_show
      parameters:
        - { name: listing, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/rides/{listing}/join:
    post:
      tags: [Carpool]
      summary: Ask to join. The price is copied at request time.
      description: Needs the rider's photo at the first join (error key `photo`).
      operationId: carpool_ride_join
      parameters:
        - { name: listing, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "422": { description: Photo missing, off route, no seats, or carpool off }
  /carpool/join-requests/{carpoolRequest}/withdraw:
    post:
      tags: [Carpool]
      summary: The rider cancels a waiting request
      operationId: carpool_request_withdraw
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/join-requests/{carpoolRequest}/leave:
    post:
      tags: [Carpool]
      summary: The rider leaves an accepted carpool
      operationId: carpool_request_leave
      parameters:
        - { name: carpoolRequest, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/trips:
    get:
      tags: [Carpool]
      summary: The rider's carpool requests and trips for My trips
      operationId: carpool_trips
      responses:
        "200": { description: OK }
  /carpool/rider/photo:
    post:
      tags: [Carpool]
      summary: Upload the rider's profile photo (shown to drivers)
      operationId: carpool_rider_photo
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        "200": { description: OK }
  /carpool/chats:
    get:
      tags: [Carpool]
      summary: Chat inbox for the signed-in rider or driver (Active and Past, one box per carpool, unread counts)
      operationId: carpool_chats
      responses:
        "200": { description: OK }
  /carpool/chats/unread:
    get:
      tags: [Carpool]
      summary: Unread carpool messages, for the badges
      operationId: carpool_chats_unread
      responses:
        "200": { description: OK }
  /carpool/chats/{conversation}:
    get:
      tags: [Carpool]
      summary: A conversation with its messages (pass after=lastMessageId for newer ones only)
      operationId: carpool_chat_show
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: integer } }
        - { name: after, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "404": { description: Not a member }
  /carpool/chats/{conversation}/messages:
    post:
      tags: [Carpool]
      summary: Send a message (1,000 characters, 20 per minute, banned words masked)
      operationId: carpool_chat_send
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Created }
        "422": { description: Read only, banned, too long or too fast }
  /carpool/chats/{conversation}/read:
    post:
      tags: [Carpool]
      summary: Mark the conversation read
      operationId: carpool_chat_read
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/chats/{conversation}/pickup:
    post:
      tags: [Carpool]
      summary: A rider asks for a new pickup, or the driver answers with another spot (on the route, before the rider drop). The other side accepts or declines
      operationId: carpool_chat_pickup
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng, name]
              properties:
                lat: { type: number }
                lng: { type: number }
                name: { type: string, maxLength: 120 }
                address: { type: string, maxLength: 255 }
      responses:
        "201": { description: Created }
  /carpool/pickup-proposals/{proposal}/accept:
    post:
      tags: [Carpool]
      summary: Accept a pickup request (the driver answers a rider request, the rider answers a driver counter-spot); the agreed pickup moves
      operationId: carpool_pickup_accept
      parameters:
        - { name: proposal, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/pickup-proposals/{proposal}/decline:
    post:
      tags: [Carpool]
      summary: The driver declines a pickup request
      operationId: carpool_pickup_decline
      parameters:
        - { name: proposal, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }
  /carpool/reports:
    post:
      tags: [Carpool]
      summary: Report a message (copy kept) or a person you share a carpool with
      operationId: carpool_report
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [spam, harassment, unsafe, photo, other] }
                message_id: { type: integer }
                user_id: { type: integer }
                listing_id: { type: integer }
                details: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Created }
components:
  schemas:
    CarpoolPlace:
      type: object
      required: [lat, lng, name, address]
      properties:
        lat: { type: number }
        lng: { type: number }
        name: { type: string, maxLength: 120, example: Bemina Bypass }
        address: { type: string, maxLength: 255 }
    CarpoolRoute:
      type: object
      required: [polyline, distance_m, duration_s]
      properties:
        polyline: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }, description: "[[lat, lng], ...], 2 to 5000 points" }
        distance_m: { type: integer }
        duration_s: { type: integer }
        summary: { type: string, maxLength: 120, example: Via Rajbagh }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
