# DreamCabs Nginx — serves Angular Admin Panel on / and Laravel API on /api
server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    # 1. API & Backend endpoints (Laravel)
    location ~ ^/(api|sanctum|broadcasting|up|livewire|docs) {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_read_timeout 120;
        }
    }

    # 2. Uploaded public storage (Driver docs, receipts, avatars)
    location /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
    }

    # 3. Direct PHP scripts (fallback)
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
    }

    # 4. Frontend Admin Dashboard (Angular Single Page Application)
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/frontend;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Don't leak dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
