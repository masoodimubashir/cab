# DreamCabs Nginx — HTTPS (Port 443) + HTTP to HTTPS Redirect (Port 80)

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP Server — Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name dreamcabs.in www.dreamcabs.in _;
    client_max_body_size 30M;

    # Allow Let's Encrypt renewal challenges over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (SSL 443)
server {
    listen 443 ssl;
    server_name dreamcabs.in www.dreamcabs.in _;
    client_max_body_size 30M;

    ssl_certificate /etc/letsencrypt/live/dreamcabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dreamcabs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. API & Backend endpoints (Laravel)
    location ~ ^/(api|sanctum|broadcasting|up|livewire|docs) {
        root /var/www/html/public;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, Idempotency-Key, X-Request-Id, X-Socket-Id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_read_timeout 120;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # 1b. Reverb WebSockets Reverse Proxy (wss://dreamcabs.in:443/app/... -> reverb:8080)
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    # 2. Uploaded public storage (Driver docs, receipts, avatars)
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 3. Direct PHP scripts (fallback)
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
    }

    # 4. Admin Dashboard (Angular SPA under /admin)
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /var/www/frontend/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 5. Landing Website (Root /)
    location / {
        root /var/www/website;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # Static asset caching for website
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/website;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Don't leak dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
