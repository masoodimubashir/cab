; ===========================================================================
; DreamCabs PHP-FPM Pool Configuration (Production)
; Prevents worker starvation, 502 Bad Gateway errors, and request lockups.
; ===========================================================================

[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 511

; Dynamic Process Manager: scales from 10 to 50 workers seamlessly
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; Recycle workers after 1000 requests to avoid memory leaks
pm.max_requests = 1000
pm.process_idle_timeout = 10s

; Safety: Kill hung requests after 120 seconds so workers are never permanently blocked
request_terminate_timeout = 120s

; Logs
catch_workers_output = yes
decorate_workers_output = no

; Preserve environment variables for Laravel (.env & Docker env)
clear_env = no
