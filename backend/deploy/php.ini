; DreamCabs PHP runtime tuning (production)
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120

; OPcache — big throughput win for Laravel in production.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.interned_strings_buffer = 16

; Sensible production error handling (logs, not screen).
display_errors = Off
log_errors = On
